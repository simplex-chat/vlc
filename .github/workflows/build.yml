name: build

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  SNAPSHOT: 20261111T002405Z

jobs:

# =============================
#       Create release
# =============================

# Create release, but only if it's triggered by tag push.
# On pull requests/commits push, this job will always complete.

  maybe-release:
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@v3

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: simplex-chat/action-gh-release@v2
        with:
          prerelease: true
          files: |
            COPYING
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# =========================
#        Linux Build
# =========================

  build-linux:
    name: "ubuntu-22.04-${{ matrix.arch }}"
    needs: maybe-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            linuxdeployqt_sha256: 974a87457ed26241b793bed7841978fcdf84158d13220e53833a06515f173b0b
          - arch: aarch64
            runner: ubuntu-22.04-arm
            linuxdeployqt_sha256: 986d52d855a8c0ea8c51564807e8fb6af3466426d29224093c040b56ba244df3
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: simplex-chat/docker-setup-buildx-action@v3

      # Otherwise we run out of disk space with Docker build
      - name: Free disk space
        shell: bash
        run: ./.github/workflows/linux_util_free_space.sh

      - name: Start container
        shell: bash
        run: |
          docker run -t -d \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            --security-opt apparmor:unconfined \
            --name builder \
            -v /home/runner/work/_temp:/home/runner/work/_temp \
            -v ${{ github.workspace }}:/project \
            debian:bookworm-20261104@sha256:268fb24c39bca92d326dd83ea3abebe4a3f7751c804ffef23bb6d857dd343ff8

      - name: Build CLI
        shell: docker exec -t builder sh -eu {0}
        run: |
          . /etc/os-release
          rm /etc/apt/sources.list.d/debian.sources
          snapshot="[check-valid-until=no] http://snapshot.debian.org/archive"
          cat > /etc/apt/sources.list <<EOF
          deb $snapshot/debian/${{ env.SNAPSHOT }} $VERSION_CODENAME main
          deb $snapshot/debian/${{ env.SNAPSHOT }} $VERSION_CODENAME-updates main
          deb $snapshot/debian-security/${{ env.SNAPSHOT }} $VERSION_CODENAME-security main
          deb-src $snapshot/debian/${{ env.SNAPSHOT }} $VERSION_CODENAME main
          EOF
          echo 'Acquire::Retries "10";' > /etc/apt/apt.conf.d/80retries
          export TZ='Etc/UTC' DEBIAN_FRONTEND=noninteractive
          apt update && apt upgrade -y

          apt build-dep -y vlc
          apt install -y git curl zip libtool automake autoconf autopoint make \
                         gettext pkg-config subversion cmake cvs zip bzip2 patchelf \
                         p7zip-full wget dos2unix ragel yasm g++ protobuf-compiler \
                         m4 ant build-essential libtool-bin libavformat-dev fuse \
                         libswresample-dev libavutil-dev libpostproc-dev libswscale-dev \
                         wayland-protocols qtbase5-private-dev libarchive-dev libmpg123-dev \
                         libnfs-dev libqt5svg5-dev flex bison curl qtdeclarative5-dev \
                         qtquickcontrols2-5-dev nasm gcovr libxkbcommon-x11-dev meson || :
          apt-get clean -y && rm -rf /var/lib/apt/lists/*
          dpkg-query -W -f '${binary:Package} ${Version}\n' > /project/vlc-linux-${{ matrix.arch }}-packages.txt

          chmod -R 777 /project && git config --global --add safe.directory '*'

          cd /project

          mkdir -p contrib/native
          (cd contrib/native && ../bootstrap --disable-all --disable-net --enable-ffmpeg && make -j"$(nproc)")

          # smbclient is disabled because it drags in samba's private libs,
          # which linuxdeployqt cannot resolve with ldd and refuses to bundle
          ./bootstrap &&\
          ./configure --prefix="/usr" --disable-smbclient --disable-lua --disable-avformat --disable-postproc &&\
          make -j"$(nproc)" &&\
          make -j"$(nproc)" DESTDIR=$(pwd)/build/ install

          ./.github/workflows/keep_plugins.sh /project/build/usr/lib/vlc/plugins

          find /project/build/usr/lib/vlc/ -maxdepth 1 -name "lib*.so*" -exec patchelf --set-rpath '$ORIGIN/../' {} \;
          find /project/build/usr/lib/vlc/plugins/ -name "lib*.so*" -exec patchelf --set-rpath '$ORIGIN/../../:$ORIGIN/../../../' {} \;

          curl -fLO 'https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-${{ matrix.arch }}.AppImage'
          echo '${{ matrix.linuxdeployqt_sha256 }}  linuxdeployqt-continuous-${{ matrix.arch }}.AppImage' | sha256sum -c -
          chmod a+x linuxdeployqt-continuous-${{ matrix.arch }}.AppImage

          # linuxdeployqt workaround
          mkdir -p /project/build/usr/share/doc/libc6 &&\
          touch /project/build/usr/share/doc/libc6/copyright

          ./linuxdeployqt-continuous-${{ matrix.arch }}.AppImage /project/build/usr/share/applications/vlc.desktop -appimage -unsupported-allow-new-glibc -bundle-non-qt-libs -exclude-libs=libfreetype.so.6

          mv VLC_media_player-*.AppImage vlc-linux-${{ matrix.arch }}.appimage && chmod 777 vlc-linux-${{ matrix.arch }}.appimage

      - name: Check bundle
        shell: bash
        run: python3 .github/workflows/check_bundle.py build/usr/lib/vlc/plugins .github/workflows/plugins/linux-${{ matrix.arch }}.txt build --max-glibc 2.35

      - name: Upload binaries
        uses: simplex-chat/action-gh-release@v2
        with:
          append_body: true
          fail_on_unmatched_files: true
          files: |
            ./vlc-linux-${{ matrix.arch }}.appimage
            ./vlc-linux-${{ matrix.arch }}-packages.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# =========================
#        MacOS Build
# =========================

  build-macos:
    name: "${{ matrix.os }}"
    needs: maybe-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            brew: /opt/homebrew
            arch: aarch64
            max_macos: '11.0'
          - os: macos-15-intel
            brew: /usr/local
            arch: x86_64
            max_macos: '10.13'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Install tools
        shell: bash
        run: |
          brew install coreutils openjdk@11
          sudo ln -sfn ${{ matrix.brew }}/opt/openjdk@11/libexec/openjdk.jdk /Library/Java/JavaVirtualMachines/openjdk-11.jdk

      - name: Prefetch contrib tarballs
        shell: bash
        run: ./.github/workflows/prefetch_tarballs.sh

      - name: Build
        shell: bash
        run: |
          export JAVA_HOME=$(/usr/libexec/java_home -v 11)
          # build.sh drops homebrew from PATH, so hand it the gnu coreutils
          export VLC_PATH=${{ matrix.brew }}/opt/coreutils/libexec/gnubin

          mkdir build
          cd build
          ../extras/package/macosx/build.sh -c -a ${{ matrix.arch }} -i u ||
            { sleep 60; ../extras/package/macosx/build.sh -c -a ${{ matrix.arch }} -i u; } ||
            { sleep 300; ../extras/package/macosx/build.sh -c -a ${{ matrix.arch }} -i u; }

          unzip -oqq vlc-*-release.zip && cd vlc-*-release
          ../../.github/workflows/keep_plugins.sh VLC.app/Contents/MacOS/plugins
          zip -r "vlc-macos-${{ matrix.arch }}.zip" . && mv "vlc-macos-${{ matrix.arch }}.zip" ..

      - name: Check bundle
        shell: bash
        run: python3 .github/workflows/check_bundle.py build/vlc-*-release/VLC.app/Contents/MacOS/plugins .github/workflows/plugins/macos-${{ matrix.arch }}.txt build/vlc-*-release/VLC.app/Contents/MacOS --max-macos ${{ matrix.max_macos }}

      - name: Upload binaries
        uses: simplex-chat/action-gh-release@v2
        with:
          append_body: true
          fail_on_unmatched_files: true
          files: ./build/vlc-macos-${{ matrix.arch }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# =========================
#      Windows Build
# =========================

  build-windows:
    name: "Windows"
    needs: maybe-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: simplex-chat/docker-setup-buildx-action@v3

      # Otherwise we run out of disk space with Docker build
      - name: Free disk space
        shell: bash
        run: ./.github/workflows/linux_util_free_space.sh

      - name: Prefetch contrib tarballs
        shell: bash
        run: ./.github/workflows/prefetch_tarballs.sh

      - name: Start container
        shell: bash
        run: |
          docker run -t -d \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            --security-opt apparmor:unconfined \
            --name builder \
            -v /home/runner/work/_temp:/home/runner/work/_temp \
            -v ${{ github.workspace }}:/project \
            ubuntu:noble-20261024.1@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852

      - name: Build CLI
        shell: docker exec -t builder sh -eu {0}
        run: |
          export TZ='Etc/UTC' DEBIAN_FRONTEND=noninteractive
          apt update && apt install -y ca-certificates
          echo 'APT::Snapshot "${{ env.SNAPSHOT }}";' > /etc/apt/apt.conf.d/50snapshot
          echo 'Acquire::Retries "10";' > /etc/apt/apt.conf.d/80retries
          apt update && apt upgrade -y

          apt install -y git wget bzip2 file libwine-dev unzip libtool libtool-bin libltdl-dev pkg-config ant \
                         build-essential automake texinfo yasm p7zip-full autopoint \
                         gettext cmake zip wine nsis g++-mingw-w64-i686 curl gperf flex bison \
                         libcurl4-gnutls-dev python3 python3-setuptools python3-mako python3-requests \
                         gcc make procps ca-certificates \
                         openjdk-11-jdk-headless nasm jq gnupg \
                         meson autoconf dos2unix

          wget https://github.com/mstorsjo/llvm-mingw/releases/download/20220906/llvm-mingw-20220906-msvcrt-ubuntu-18.04-x86_64.tar.xz
          echo '98e947520a68d180e1d2e5e9c519dd6270986e9001662c2eca6fbc502fd272e6  llvm-mingw-20220906-msvcrt-ubuntu-18.04-x86_64.tar.xz' | sha256sum -c -
          tar xvf llvm-mingw-20220906-msvcrt-ubuntu-18.04-x86_64.tar.xz -C /opt
          export PATH=/opt/llvm-mingw-20220906-msvcrt-ubuntu-18.04-x86_64/bin:$PATH

          update-alternatives --set java /usr/lib/jvm/java-11-openjdk-amd64/bin/java
          chmod -R 777 /project && git config --global --add safe.directory '*'

          mkdir /project/build && cd /project/build
          ../extras/package/win32/build.sh -a x86_64 -l -r -i r ||
            { sleep 60; ../extras/package/win32/build.sh -a x86_64 -l -r -i r; } ||
            { sleep 300; ../extras/package/win32/build.sh -a x86_64 -l -r -i r; } || :

          mkdir win64/allowed && cd win64/allowed
          unzip -q ../vlc-*-win64.zip
          /project/.github/workflows/keep_plugins.sh vlc-*/plugins
          zip -qr ../vlc-win-${{ matrix.arch }}.zip vlc-*
          chmod 777 ../vlc-win-${{ matrix.arch }}.zip

      - name: Check bundle
        shell: bash
        run: python3 .github/workflows/check_bundle.py build/win64/allowed/vlc-*/plugins .github/workflows/plugins/win-${{ matrix.arch }}.txt build/win64/allowed/vlc-*

      - name: Upload binaries
        uses: simplex-chat/action-gh-release@v2
        with:
          append_body: true
          fail_on_unmatched_files: true
          files: ./build/win64/vlc-win-${{ matrix.arch }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
